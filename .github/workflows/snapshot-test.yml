name: Zeebe SNAPSHOT test
on:
  workflow_dispatch: { }
  workflow_call: { }
  schedule:
    - cron: "0 3 * * 1-5"
permissions:
  contents: read
  actions: read
jobs:
  test-against-zeebe-snapshot:
    name: Run tests against Zeebe SNAPSHOT version (${{ matrix.branch }}${{ matrix.profile && format(' + {0}', matrix.profile) || '' }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: stable/8.6
          - branch: stable/8.7
          - branch: stable/8.7
            profile: spring-boot-4.0
          - branch: stable/8.8
          - branch: stable/8.8
            profile: spring-boot-4.0
          - branch: stable/8.9

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Zeebe SNAPSHOT version
        run: |
          CURRENT_ZEEBE_VERSION=$(mvn help:evaluate -Dexpression=dependency.zeebe.version -DforceStdout -q)
          if grep -q "alpha" <<< "$CURRENT_ZEEBE_VERSION"; then
            NEW_ZEEBE_VERSION=$(echo $CURRENT_ZEEBE_VERSION | sed "s/alpha.*/SNAPSHOT/")
          elif grep -q "SNAPSHOT" <<< "$CURRENT_ZEEBE_VERSION"; then
            NEW_ZEEBE_VERSION=$CURRENT_ZEEBE_VERSION
          else
            NEW_ZEEBE_VERSION=`echo $CURRENT_ZEEBE_VERSION | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.`-SNAPSHOT
          fi
          echo $NEW_ZEEBE_VERSION
          PROFILE_ARG=""
          if [ -n "$PROFILE" ]; then
            PROFILE_ARG="-P$PROFILE"
          fi
          mvn -B -U $PROFILE_ARG "-Dsurefire.rerunFailingTestsCount=5" -Ddependency.zeebe.version=$NEW_ZEEBE_VERSION clean install
        env:
          PROFILE: ${{ matrix.profile }}

      - name: Set artifact name
        if: always()
        id: artifact
        run: echo "name=${BRANCH//\//-}${PROFILE:+-$PROFILE}" >> $GITHUB_OUTPUT
        env:
          BRANCH: ${{ matrix.branch }}
          PROFILE: ${{ matrix.profile }}

      - name: Archive Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Unit Test Results Against Zeebe Snapshot (${{ steps.artifact.outputs.name }})
          path: "**/target/surefire-reports/"
          retention-days: 7

  notify-if-failed:
    permissions:
      contents: read
      actions: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    name: Send slack notification on build failure
    runs-on: ubuntu-latest
    needs: [test-against-zeebe-snapshot]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - name: Get failed branches
        id: failed-branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --paginate --jq '[.jobs[] | select(.conclusion == "failure") | .name | capture("\\((?<branch>[^)]+)\\)") | .branch] | unique | join(", ")')
          echo "branches=$FAILED" >> $GITHUB_OUTPUT
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_CPT_ZPT_CI_WEBHOOK;    
      - id: slack-notify
        name: Send slack notification
        uses: slackapi/slack-github-action@v3.0.3
        if: steps.secrets.outputs.SLACK_CPT_ZPT_CI_WEBHOOK != ''
        with:
          webhook: ${{ steps.secrets.outputs.SLACK_CPT_ZPT_CI_WEBHOOK }}
          webhook-type: incoming-webhook
          # For posting a rich message using Block Kit
          payload: |
            {
              "blocks": [
                {
                   "type": "section",
                   "text": {
                     "type": "mrkdwn",
                     "text": ":alarm: *Zeebe Process Test (ZPT) Compatibility Tests Failed*"
                   }
                 },
                 {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Branches: `${{ steps.failed-branches.outputs.branches }}`\nZeebe version: `SNAPSHOT`\nPlease check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
